<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <!--
    The install window's background.

    One instruction, drawn rather than written: the arrow says drag left to
    right and the two drop shadows say where. Everything else is the app's own
    paper and field, so the first thing someone sees of clide already looks
    like clide.
  -->
  <defs>
    <radialGradient id="field" cx="22%" cy="14%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="52%" stop-color="#F1F8FC"/>
      <stop offset="100%" stop-color="#E1EDF7"/>
    </radialGradient>
  </defs>

  <rect width="660" height="400" fill="url(#field)"/>

  <!-- The wordmark, small, top-left, exactly as the app draws it. -->
  <g transform="translate(40 38)">
    <g fill="#3B7CA8">
      <rect x="0"  y="12" width="5"  height="10" rx="2.5"/>
      <rect x="9"  y="6"  width="5"  height="22" rx="2.5"/>
      <rect x="18" y="0"  width="5"  height="34" rx="2.5"/>
      <rect x="27" y="9"  width="5"  height="16" rx="2.5"/>
      <rect x="36" y="14" width="5"  height="7"  rx="2.5"/>
    </g>
    <text x="52" y="26" font-family="Montserrat, -apple-system, sans-serif"
          font-size="24" font-weight="500" fill="#0A2338">clide</text>
  </g>

  <text x="40" y="96" font-family="DM Sans, -apple-system, sans-serif"
        font-size="13" fill="#4A6076">Drag clide into Applications to install it.</text>

  <!-- The arrow between the two icon wells. -->
  <g stroke="#9FC2D8" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M283 218 L377 218" stroke-dasharray="1 11"/>
  </g>
  <path d="M377 218 l-11 -7 v14 z" fill="#9FC2D8"/>

  <text x="330" y="352" text-anchor="middle"
        font-family="DM Sans, -apple-system, sans-serif" font-size="11" fill="#7C93A6">
    Free and open source · MIT · clide.staraep.fun
  </text>
</svg>
